name: CI

# 私有仓库的 macOS 分钟按 10 倍计费:PR 只跑 pull_request,push 只跑 main;纯文档改动不跑
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "design/**"
      - "packaging/*.txt"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "design/**"
      - "packaging/*.txt"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Lint Info.plist
        run: plutil -lint Info.plist

      # 两种架构分别构建,产物在 .build/<triple>/release/,不依赖 .build/release 软链
      - name: Build release (arm64)
        run: swift build -c release --arch arm64 -Xswiftc -warnings-as-errors

      - name: Build release (x86_64)
        run: swift build -c release --arch x86_64 -Xswiftc -warnings-as-errors

      - name: Universal binary (lipo)
        run: |
          ARM_BIN="$(swift build -c release --arch arm64 --show-bin-path)/ClipboardHistory"
          X86_BIN="$(swift build -c release --arch x86_64 --show-bin-path)/ClipboardHistory"
          echo "arm64:  $ARM_BIN"
          echo "x86_64: $X86_BIN"
          mkdir -p universal
          lipo -create "$ARM_BIN" "$X86_BIN" -output universal/ClipboardHistory
          lipo -info universal/ClipboardHistory
          lipo universal/ClipboardHistory -verify_arch arm64 x86_64

      - name: Unit tests
        run: swift test -Xswiftc -warnings-as-errors

      # 验收第 2 项:真实系统剪贴板 → history.db(文本 kind=0 / PNG kind=1 / 文件 URL kind=2)
      - name: Capture smoke test (real pasteboard)
        run: |
          scripts/ci-capture-smoke.sh "$(swift build -c release --arch arm64 --show-bin-path)/ClipboardHistory"
          if [ -e "$HOME/Library/Application Support/ClipboardHistory/history.db" ]; then
            echo "::error::smoke test touched the default history.db"; exit 1
          fi

      # 验收 3(窗口几何)/ 4(多行文本搜索不崩)/ 5(方向键跨类型切换不崩),临时数据库
      - name: Panel smoke test (geometry, search, arrows)
        run: |
          scripts/ci-panel-smoke.sh "$(swift build -c release --arch arm64 --show-bin-path)/ClipboardHistory" ci-artifacts/panel
          if [ -e "$HOME/Library/Application Support/ClipboardHistory/history.db" ]; then
            echo "::error::smoke test touched the default history.db"; exit 1
          fi

      # ⌘⌥C 唤出/隐藏、ESC、↩ 粘贴到 TextEdit、⌘↩ 仅复制、菜单栏各项,临时数据库
      - name: Hotkey / paste / menu smoke test
        run: |
          scripts/ci-hotkey-smoke.sh "$(swift build -c release --arch arm64 --show-bin-path)/ClipboardHistory" ci-artifacts/hotkey
          if [ -e "$HOME/Library/Application Support/ClipboardHistory/history.db" ]; then
            echo "::error::smoke test touched the default history.db"; exit 1
          fi

      # 分发包一律 ad-hoc 签名,CI 中不创建证书
      - name: Package (SIGN=adhoc ./package.sh)
        env:
          SWIFT_BUILD_FLAGS: -Xswiftc -warnings-as-errors
        run: SIGN=adhoc ./package.sh

      # 验收 6(签名、zip 解压后再校验、DMG 内容)/ 7(lipo -info),并启动一次打包后的 app
      - name: Verify package
        run: |
          scripts/ci-verify-package.sh ci-artifacts/package
          if [ -e "$HOME/Library/Application Support/ClipboardHistory/history.db" ]; then
            echo "::error::package launch touched the default history.db"; exit 1
          fi

      - name: Upload package (zip + dmg)
        uses: actions/upload-artifact@v5
        with:
          name: ClipboardHistory-package
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

      - name: Upload icon preview
        uses: actions/upload-artifact@v5
        with:
          name: app-icon-preview
          path: build/AppIcon.iconset
          if-no-files-found: error

      - name: Upload UI smoke screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-smoke
          path: ci-artifacts
          if-no-files-found: warn

      - name: Upload universal binary
        uses: actions/upload-artifact@v5
        with:
          name: ClipboardHistory-universal
          path: universal/ClipboardHistory
          if-no-files-found: error

  # 主人用 macOS 26 SDK 构建,坑 2 / 坑 4 中的 API 在该 SDK 下是编译错误,需单独验证
  build-macos26-sdk:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          sw_vers
          xcode-select -p
          xcrun --show-sdk-version
          swift --version
          case "$(xcrun --show-sdk-version)" in
            26*) ;;
            *) echo "::error::macOS SDK is not 26.x"; exit 1 ;;
          esac

      - name: Build release (arm64)
        run: swift build -c release --arch arm64 -Xswiftc -warnings-as-errors

      - name: Unit tests
        run: swift test -Xswiftc -warnings-as-errors
